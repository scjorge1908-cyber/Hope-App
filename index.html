<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e3a8a">
    <title>Hope - Gestão de Guias</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #1e3a8a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            position: fixed;
            top: 0;
            left: 0;
        }

        #appContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }

        #appFrame {
            display: block;
            border: none;
            background: #f0f4f8;
        }

        #loadingScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #2563eb 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.6s ease;
        }

        #loadingScreen.hide {
            opacity: 0;
            pointer-events: none;
        }

        .loading-logo {
            width: 100px;
            height: 100px;
            margin-bottom: 24px;
            animation: pulse 1.5s ease-in-out infinite;
            border-radius: 24px;
        }

        .loading-text {
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .loading-sub {
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            margin-bottom: 30px;
        }

        .loading-bar {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            overflow: hidden;
        }

        .loading-bar-fill {
            width: 30%;
            height: 100%;
            background: #4ade80;
            border-radius: 4px;
            animation: loadBar 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }

        @keyframes loadBar {
            0% { width: 10%; margin-left: 0; }
            50% { width: 50%; margin-left: 25%; }
            100% { width: 10%; margin-left: 90%; }
        }

        #installBanner {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: white;
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
            z-index: 2000;
            max-width: 400px;
            width: 90%;
            animation: slideUp 0.4s ease;
        }

        .install-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .install-icon { font-size: 36px; }
        .install-text { flex: 1; }
        .install-text strong { display: block; font-size: 0.95rem; margin-bottom: 2px; }
        .install-text small { opacity: 0.7; font-size: 0.8rem; }

        .btn-install {
            background: #4ade80;
            color: #1e3a8a;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-install:hover { background: #22c55e; }

        .btn-dismiss {
            position: absolute;
            top: 6px; right: 10px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 16px;
            cursor: pointer;
        }

        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <img src="icon-192.png" class="loading-logo" alt="Hope">
        <div class="loading-text">HOPE CLÍNICA</div>
        <div class="loading-sub">Sistema de Gestão de Guias</div>
        <div class="loading-bar">
            <div class="loading-bar-fill"></div>
        </div>
    </div>

    <div id="appContainer">
        <iframe 
            id="appFrame" 
            src="https://script.google.com/macros/s/AKfycbzSyj6uMarqX5smdecFCcTu-mKx8MLN8dzO1V7vaX3do0quHSNRSHSMf0wHqk5fxBpz/exec"
            allow="clipboard-write"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation"
        ></iframe>
    </div>

    <div id="installBanner">
        <button class="btn-dismiss" onclick="dismissInstall()">&#10005;</button>
        <div class="install-content">
            <span class="install-icon">&#128242;</span>
            <div class="install-text">
                <strong>Instalar Hope Clínica</strong>
                <small>Acesse direto do desktop ou celular</small>
            </div>
            <button class="btn-install" onclick="installApp()">INSTALAR</button>
        </div>
    </div>

    <script>
        var iframe = document.getElementById('appFrame');
        var container = document.getElementById('appContainer');

        function resizeIframe() {
            var w = window.innerWidth;
            var h = window.innerHeight;
            iframe.style.width = w + 'px';
            iframe.style.height = h + 'px';
            container.style.width = w + 'px';
            container.style.height = h + 'px';
        }

        resizeIframe();
        window.addEventListener('resize', resizeIframe);
        window.addEventListener('orientationchange', function() {
            setTimeout(resizeIframe, 200);
        });

        var loading = document.getElementById('loadingScreen');
        
        iframe.addEventListener('load', function() {
            setTimeout(function() {
                loading.classList.add('hide');
                setTimeout(function() { if (loading.parentNode) loading.remove(); }, 600);
            }, 800);
        });

        setTimeout(function() {
            if (loading && loading.parentNode) {
                loading.classList.add('hide');
                setTimeout(function() { if (loading.parentNode) loading.remove(); }, 600);
            }
        }, 10000);

        var deferredPrompt;

        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            deferredPrompt = e;
            setTimeout(function() {
                document.getElementById('installBanner').style.display = 'block';
            }, 3000);
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(function() {
                    deferredPrompt = null;
                    dismissInstall();
                });
            }
        }

        function dismissInstall() {
            document.getElementById('installBanner').style.display = 'none';
        }

        window.addEventListener('appinstalled', function() {
            dismissInstall();
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
